<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>笛伴 · 合成输入验收（不使用真实麦克风）</title>
  <body>
    <div id="app"></div>
    <aside
      id="fixture-controls"
      style="
        position: fixed;
        z-index: 100;
        bottom: 8px;
        left: 8px;
        right: 8px;
        background: #172d24;
        color: white;
        padding: 12px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font: 13px sans-serif;
        border: 2px solid #e99355;
        border-radius: 8px;
      "
    >
      <strong>测试输入 · 非真实麦克风 · 记录只存在内存</strong>
      <button id="correct">输入正确音 B4</button>
      <button id="high">输入偏高 80 音分</button>
      <button id="silent">输入静音</button>
      <button id="deny">下次拒绝授权</button>
      <button id="disconnect">模拟设备断开</button>
      <button id="upper">输入 E 调高音 6</button>
      <button id="wobble">微颤输入（短暂偏离）</button>
      <button id="filter-test">验证高通频响</button>
      <span id="fixture-state">初始：静音</span>
    </aside>
    <script type="module">
      // Dev-only integration fixture; Vite's production build only includes index.html.
      // This fixture never calls the real getUserMedia and never writes real localStorage.
      const memory = new Map();
      Object.defineProperty(window, "localStorage", {
        value: {
          getItem: (key) => memory.get(key) || null,
          setItem: (key, value) => memory.set(key, value),
        },
      });
      let context, oscillator, gain, destination;
      let frequency = 493.883301;
      let volume = 0;
      let denied = false;
      let wobbleTimer;
      const tracks = [];
      Object.defineProperty(navigator, "mediaDevices", {
        value: {
          getUserMedia: async () => {
            if (denied) {
              denied = false;
              throw new DOMException("Fixture: denied", "NotAllowedError");
            }
            context ||= new AudioContext();
            await context.resume();
            if (!oscillator) {
              oscillator = context.createOscillator();
              gain = context.createGain();
              destination = context.createMediaStreamDestination();
              oscillator.connect(gain).connect(destination);
              oscillator.start();
            }
            oscillator.frequency.value = frequency;
            gain.gain.value = volume;
            const stream = destination.stream.clone();
            tracks.push(...stream.getTracks());
            return stream;
          },
        },
      });
      function input(hz, amplitude, description) {
        clearInterval(wobbleTimer);
        frequency = hz;
        volume = amplitude;
        if (oscillator) {
          oscillator.frequency.value = hz;
          gain.gain.value = amplitude;
        }
        document.querySelector("#fixture-state").textContent = description;
      }
      document.querySelector("#correct").onclick = () =>
        input(493.883301, 0.2, "输入：正确 B4");
      document.querySelector("#high").onclick = () =>
        input(493.883301 * 2 ** (80 / 1200), 0.2, "输入：偏高 80 音分");
      document.querySelector("#silent").onclick = () =>
        input(493.883301, 0, "输入：静音");
      document.querySelector("#upper").onclick = () => input(2217.4610488, .2, "输入：E 调高音 6 / C#7");
      document.querySelector("#wobble").onclick = () => {
        input(493.883301, .2, "输入：每秒一次 150 ms 偏高，持续微颤");
        let step = 0;
        wobbleTimer = setInterval(() => {
          if (oscillator) oscillator.frequency.value = 493.883301 * 2 ** ((step++ % 20 < 3 ? 65 : 8 * Math.sin(step)) / 1200);
        }, 50);
      };
      document.querySelector("#filter-test").onclick = async () => {
        const { AudioEngine } = await import("/src/audio.js");
        const audio = new AudioEngine();
        await audio.start(() => {}, () => {});
        const frequencies = new Float32Array([50, 150, 494, 2637]);
        const magnitude = new Float32Array(4);
        const phase = new Float32Array(4);
        audio.highpass.getFrequencyResponse(frequencies, magnitude, phase);
        const db = Array.from(magnitude, (n) => 20 * Math.log10(n));
        document.querySelector("#fixture-state").textContent = `${db[0] < -18 && Math.abs(db[1] + 3.01) < .1 && db[2] > -1 && db[3] > -1 ? "PASS" : "FAIL"} 高通：${Array.from(frequencies, (f,i)=>`${f} Hz / ${db[i].toFixed(1)} dB`).join("；")}`;
        audio.stop();
      };
      document.querySelector("#deny").onclick = () => {
        denied = true;
        document.querySelector("#fixture-state").textContent = "下次请求将拒绝";
      };
      document.querySelector("#disconnect").onclick = () => {
        tracks.forEach((track) => {
          const handler = track.onended;
          track.stop();
          handler?.();
        });
        document.querySelector("#fixture-state").textContent = "设备已断开";
      };
      await import("/src/main.js");
    </script>
  </body>
</html>
